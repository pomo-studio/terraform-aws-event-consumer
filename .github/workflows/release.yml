name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## Usage

            ```hcl
            module "event_consumer" {
              source  = "pomo-studio/event-consumer/aws"
              version = "~> 1.0"

              providers = {
                aws.primary = aws.primary
                aws.dr      = aws.dr
              }

              name             = "order-processor"
              bus_name_primary = "my-event-bus"
              bus_name_dr      = "my-event-bus"

              event_pattern = {
                source      = ["com.myapp.orders"]
                detail-type = ["OrderCreated"]
              }
            }
            ```

            ## Full Documentation

            See [README.md](https://github.com/pomo-studio/terraform-aws-event-consumer/blob/${{ steps.get_version.outputs.VERSION }}/README.md) for complete documentation.
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.VERSION, 'alpha') || contains(steps.get_version.outputs.VERSION, 'beta') || contains(steps.get_version.outputs.VERSION, 'rc') }}
